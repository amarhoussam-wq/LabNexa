# Nixpacks configuration for Coolify deployment of LabNexa (Laravel)
# Prevents VPS Out-Of-Memory (Exit Code 255) by using lightweight pre-compiled PHP binaries

providers = ["php"]

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
    "php artisan config:clear || true",
    "php artisan route:clear || true",
    "php artisan view:clear || true",
    "php artisan storage:link || true"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=80"
